server:
  compression:
    enabled: true
    min-response-size: 1KB
  forward-headers-strategy: framework
  port: ${API_PORT:${SERVER_PORT:18080}}

spring:
  application:
    name: algo-mentor-api
  web:
    resources:
      cache:
        # index.html、favicon 等固定 URL 资源可缓存，但每次使用前必须与服务端重新校验。
        cachecontrol:
          no-cache: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    # db/migration 会递归扫描依赖模块下的子目录，新增 V 版本号必须跨模块唯一。
    locations:
      - classpath:db/migration
  session:
    timeout: ${AUTH_SESSION_TIMEOUT:7d}
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: ${DATABASE_BACKUP_MAX_UPLOAD_SIZE:2GB}
      max-request-size: ${DATABASE_BACKUP_MAX_UPLOAD_SIZE:2GB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

algo-mentor:
  user-input-limits:
    review-note:
      core-idea-max-chars: ${USER_INPUT_REVIEW_CORE_IDEA_MAX_CHARS:2000}
      data-structure-notes-max-chars: ${USER_INPUT_REVIEW_DATA_STRUCTURE_NOTES_MAX_CHARS:1000}
      algorithm-notes-max-chars: ${USER_INPUT_REVIEW_ALGORITHM_NOTES_MAX_CHARS:1000}
      custom-item-max-chars: ${USER_INPUT_REVIEW_CUSTOM_ITEM_MAX_CHARS:50}
      custom-item-max-count: ${USER_INPUT_REVIEW_CUSTOM_ITEM_MAX_COUNT:10}
      custom-complexity-max-chars: ${USER_INPUT_REVIEW_CUSTOM_COMPLEXITY_MAX_CHARS:100}
      edge-cases-max-chars: ${USER_INPUT_REVIEW_EDGE_CASES_MAX_CHARS:1000}
      request-max-bytes: ${USER_INPUT_REVIEW_REQUEST_MAX_BYTES:32KB}
    learning-plan-create:
      objective-max-chars: ${USER_INPUT_PLAN_OBJECTIVE_MAX_CHARS:300}
      additional-constraints-max-chars: ${USER_INPUT_PLAN_ADDITIONAL_CONSTRAINTS_MAX_CHARS:1000}
      request-max-bytes: ${USER_INPUT_PLAN_REQUEST_MAX_BYTES:8KB}
    practice-message:
      message-max-bytes: ${USER_INPUT_PRACTICE_MESSAGE_MAX_BYTES:8KB}
      request-max-bytes: ${USER_INPUT_PRACTICE_REQUEST_MAX_BYTES:20KB}
  api:
    sse:
      learning-plan-draft-timeout: ${LEARNING_PLAN_DRAFT_SSE_TIMEOUT:6m}
      practice-message-timeout: ${PRACTICE_MESSAGE_SSE_TIMEOUT:6m}
      agent-conversation-timeout: ${AGENT_CONVERSATION_SSE_TIMEOUT:6m}
  database-backup:
    enabled: ${DATABASE_BACKUP_ENABLED:false}
    pg-dump-path: ${PG_DUMP_PATH:pg_dump}
    pg-restore-path: ${PG_RESTORE_PATH:pg_restore}
    psql-path: ${PSQL_PATH:psql}
    command-timeout: ${DATABASE_BACKUP_COMMAND_TIMEOUT:10m}
    max-upload-size: ${DATABASE_BACKUP_MAX_UPLOAD_SIZE:2GB}
    application-version: ${DATABASE_BACKUP_APPLICATION_VERSION:0.1.0-SNAPSHOT}
  auth:
    login-success-url: ${AUTH_LOGIN_SUCCESS_URL:/}
    logout-success-url: ${AUTH_LOGOUT_SUCCESS_URL:/}
    session-timeout: ${AUTH_SESSION_TIMEOUT:7d}
    session-monitoring-active-window: ${AUTH_SESSION_MONITORING_ACTIVE_WINDOW:5m}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    admin-emails: ${AUTH_ADMIN_EMAILS:}
    password-login-enabled: ${AUTH_PASSWORD_LOGIN_ENABLED:false}
    password-registration-enabled: ${AUTH_PASSWORD_REGISTRATION_ENABLED:false}
    account-registration-enabled: ${AUTH_ACCOUNT_REGISTRATION_ENABLED:true}
  agent:
    runtime:
      enabled: ${AGENT_RUNTIME_ENABLED:true}
    max-steps: ${AGENT_MAX_STEPS:50}
    tool-choice: ${AGENT_TOOL_CHOICE:auto}
    specific-tool-name: ${AGENT_SPECIFIC_TOOL_NAME:}
    executor:
      groups:
        practice: ${AGENT_EXECUTOR_GROUP_PRACTICE:27}
        learning-plan: ${AGENT_EXECUTOR_GROUP_LEARNING_PLAN:2}
        learner-profile-background: ${AGENT_EXECUTOR_GROUP_LEARNER_PROFILE_BACKGROUND:1}
      keep-alive: ${AGENT_EXECUTOR_KEEP_ALIVE:60s}
      shutdown-timeout: ${AGENT_EXECUTOR_SHUTDOWN_TIMEOUT:30s}
      thread-name-prefix: ${AGENT_EXECUTOR_THREAD_NAME_PREFIX:agent-loop-}
    # 阶段一权限 pending request 使用单实例内存实现；多实例部署前需要替换为共享 coordinator。
    tool-permission:
      enabled: ${AGENT_TOOL_PERMISSION_ENABLED:true}
      timeout: ${AGENT_TOOL_PERMISSION_TIMEOUT:60s}
      cleanup-interval: ${AGENT_TOOL_PERMISSION_CLEANUP_INTERVAL:2m}
    compaction:
      inline-max-chars: ${AGENT_TOOL_RESULT_INLINE_MAX_CHARS:12000}
      preview-max-chars: ${AGENT_TOOL_RESULT_PREVIEW_MAX_CHARS:2000}
      range-read-max-chars: ${AGENT_TOOL_RESULT_RANGE_READ_MAX_CHARS:8000}
      blob-enabled: ${AGENT_TOOL_RESULT_BLOB_ENABLED:true}
      tool-results-total-max-chars: ${AGENT_RUN_CONTEXT_TOOL_RESULTS_TOTAL_MAX_CHARS:60000}
      keep-recent-tool-results: ${AGENT_RUN_CONTEXT_KEEP_RECENT_TOOL_RESULTS:3}
      compact-old-tool-results: ${AGENT_RUN_CONTEXT_COMPACT_OLD_TOOL_RESULTS:true}
      input-token-budget: ${AGENT_RUN_CONTEXT_INPUT_TOKEN_BUDGET:120000}
      max-message-groups: ${AGENT_RUN_CONTEXT_MAX_MESSAGE_GROUPS:80}
      snip-keep-head-groups: ${AGENT_RUN_CONTEXT_SNIP_KEEP_HEAD_GROUPS:2}
      snip-keep-tail-groups: ${AGENT_RUN_CONTEXT_SNIP_KEEP_TAIL_GROUPS:24}
      group-aware-snip-enabled: ${AGENT_RUN_CONTEXT_GROUP_AWARE_SNIP_ENABLED:true}
      llm-compact-enabled: ${AGENT_RUN_CONTEXT_LLM_COMPACT_ENABLED:false}
    tools:
      calculator:
        enabled: ${AGENT_CALCULATOR_TOOL_ENABLED:true}
      problem-filters:
        enabled: ${AGENT_PROBLEM_FILTERS_TOOL_ENABLED:true}
      problem-search:
        enabled: ${AGENT_PROBLEM_SEARCH_TOOL_ENABLED:true}
      problem-statement:
        enabled: ${AGENT_PROBLEM_STATEMENT_TOOL_ENABLED:true}
  review:
    scheduler:
      desired-retention: ${REVIEW_DESIRED_RETENTION:0.90}
      maximum-interval-days: ${REVIEW_MAXIMUM_INTERVAL_DAYS:36500}
      enable-fuzzing: ${REVIEW_ENABLE_FUZZING:true}
      graduating-interval-days: ${REVIEW_GRADUATING_INTERVAL_DAYS:1}
      easy-interval-days: ${REVIEW_EASY_INTERVAL_DAYS:4}
    seed:
      high-score-ratio: ${REVIEW_HIGH_SCORE_RATIO:0.90}
      low-confidence-first-interval-days: ${REVIEW_LOW_CONFIDENCE_FIRST_INTERVAL_DAYS:1}
      passed-first-interval-days: ${REVIEW_PASSED_FIRST_INTERVAL_DAYS:3}
      passed-high-score-interval-days: ${REVIEW_PASSED_HIGH_SCORE_INTERVAL_DAYS:4}
    queue:
      daily-cap: ${REVIEW_QUEUE_DAILY_CAP:20}
      daily-new-limit: ${REVIEW_DAILY_NEW_LIMIT:10}
      daily-learning-limit: ${REVIEW_DAILY_LEARNING_LIMIT:50}
      daily-review-limit: ${REVIEW_DAILY_REVIEW_LIMIT:30}
  learning-plan-template:
    seed:
      enabled: ${LEARNING_PLAN_TEMPLATE_SEED_ENABLED:false}
      path: ${LEARNING_PLAN_TEMPLATE_SEED_PATH:data/learning-plan-template-seed}
  problem:
    metadata-seed:
      enabled: ${PROBLEM_METADATA_SEED_ENABLED:false}
      path: ${PROBLEM_METADATA_SEED_PATH:data/problem-metadata-seed}
  learning-plan:
    governance:
      quota-zone: ${LEARNING_PLAN_QUOTA_ZONE:UTC}
      generation-recovery:
        enabled: ${LEARNING_PLAN_GENERATION_RECOVERY_ENABLED:true}
        minimum-age: ${LEARNING_PLAN_GENERATION_RECOVERY_MINIMUM_AGE:1m}
      cleanup:
        enabled: ${LEARNING_PLAN_DRAFT_CLEANUP_ENABLED:true}
        fixed-delay: ${LEARNING_PLAN_DRAFT_CLEANUP_FIXED_DELAY:1h}
        batch-size: ${LEARNING_PLAN_DRAFT_CLEANUP_BATCH_SIZE:1000}
        daily-usage-retention-days: ${LEARNING_PLAN_DRAFT_USAGE_RETENTION_DAYS:30}
    realtime-stream:
      enabled: ${LEARNING_PLAN_REALTIME_STREAM_ENABLED:${algo-mentor.learning-plan.generation.realtime-stream.enabled:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_ENABLED:true}}}
      host: ${LEARNING_PLAN_REALTIME_STREAM_HOST:${algo-mentor.learning-plan.generation.realtime-stream.host:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_HOST:localhost}}}
      port: ${LEARNING_PLAN_REALTIME_STREAM_PORT:${algo-mentor.learning-plan.generation.realtime-stream.port:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_PORT:6380}}}
      database: ${LEARNING_PLAN_REALTIME_STREAM_DATABASE:${algo-mentor.learning-plan.generation.realtime-stream.database:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_DATABASE:0}}}
      username: ${LEARNING_PLAN_REALTIME_STREAM_USERNAME:${algo-mentor.learning-plan.generation.realtime-stream.username:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_USERNAME:}}}
      password: ${LEARNING_PLAN_REALTIME_STREAM_PASSWORD:${algo-mentor.learning-plan.generation.realtime-stream.password:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_PASSWORD:}}}
      ssl-enabled: ${LEARNING_PLAN_REALTIME_STREAM_SSL_ENABLED:${algo-mentor.learning-plan.generation.realtime-stream.ssl-enabled:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_SSL_ENABLED:false}}}
      command-timeout: ${LEARNING_PLAN_REALTIME_STREAM_COMMAND_TIMEOUT:${algo-mentor.learning-plan.generation.realtime-stream.command-timeout:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_COMMAND_TIMEOUT:3s}}}
      connect-timeout: ${LEARNING_PLAN_REALTIME_STREAM_CONNECT_TIMEOUT:${algo-mentor.learning-plan.generation.realtime-stream.connect-timeout:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_CONNECT_TIMEOUT:2s}}}
      shutdown-timeout: ${LEARNING_PLAN_REALTIME_STREAM_SHUTDOWN_TIMEOUT:${algo-mentor.learning-plan.generation.realtime-stream.shutdown-timeout:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_SHUTDOWN_TIMEOUT:2s}}}
      read-block: ${LEARNING_PLAN_REALTIME_STREAM_READ_BLOCK:${algo-mentor.learning-plan.generation.realtime-stream.read-block:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_READ_BLOCK:2s}}}
      max-read-connections: ${LEARNING_PLAN_REALTIME_STREAM_MAX_READ_CONNECTIONS:${algo-mentor.learning-plan.generation.realtime-stream.max-read-connections:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_MAX_READ_CONNECTIONS:32}}}
      active-retention: ${LEARNING_PLAN_REALTIME_STREAM_ACTIVE_RETENTION:${algo-mentor.learning-plan.generation.realtime-stream.active-retention:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_ACTIVE_RETENTION:2h}}}
      completed-retention: ${LEARNING_PLAN_REALTIME_STREAM_COMPLETED_RETENTION:${algo-mentor.learning-plan.generation.realtime-stream.completed-retention:${LEARNING_PLAN_GENERATION_REALTIME_STREAM_COMPLETED_RETENTION:24h}}}
  learner-memory:
    declared-update:
      enabled: ${LEARNER_MEMORY_DECLARED_UPDATE_ENABLED:false}
      max-stale-retries: ${LEARNER_MEMORY_DECLARED_UPDATE_MAX_STALE_RETRIES:1}
      result-summary-max-chars: ${LEARNER_MEMORY_DECLARED_UPDATE_RESULT_SUMMARY_MAX_CHARS:300}
    profile-document:
      statement-ref-hmac-secret: ${LEARNER_PROFILE_DOCUMENT_STATEMENT_REF_HMAC_SECRET:}
    code-review-consumer:
      enabled: ${LEARNER_MEMORY_CODE_REVIEW_CONSUMER_ENABLED:false}
      max-stale-retries: ${LEARNER_MEMORY_CODE_REVIEW_CONSUMER_MAX_STALE_RETRIES:1}
    recall:
      practice-chat:
        enabled: ${LEARNER_MEMORY_RECALL_PRACTICE_CHAT_ENABLED:false}
        bootstrap-token-budget: ${LEARNER_MEMORY_RECALL_BOOTSTRAP_TOKEN_BUDGET:1000}
  practice-chat:
    realtime-stream:
      enabled: ${PRACTICE_REALTIME_STREAM_ENABLED:true}
      host: ${PRACTICE_REALTIME_STREAM_HOST:localhost}
      port: ${PRACTICE_REALTIME_STREAM_PORT:6380}
      database: ${PRACTICE_REALTIME_STREAM_DATABASE:0}
      username: ${PRACTICE_REALTIME_STREAM_USERNAME:}
      password: ${PRACTICE_REALTIME_STREAM_PASSWORD:}
      ssl-enabled: ${PRACTICE_REALTIME_STREAM_SSL_ENABLED:false}
      command-timeout: ${PRACTICE_REALTIME_STREAM_COMMAND_TIMEOUT:3s}
      connect-timeout: ${PRACTICE_REALTIME_STREAM_CONNECT_TIMEOUT:2s}
      shutdown-timeout: ${PRACTICE_REALTIME_STREAM_SHUTDOWN_TIMEOUT:2s}
      read-block: ${PRACTICE_REALTIME_STREAM_READ_BLOCK:2s}
      max-read-connections: ${PRACTICE_REALTIME_STREAM_MAX_READ_CONNECTIONS:32}
      active-retention: ${PRACTICE_REALTIME_STREAM_ACTIVE_RETENTION:2h}
      completed-retention: ${PRACTICE_REALTIME_STREAM_COMPLETED_RETENTION:24h}
    learning-state:
      enabled: ${PRACTICE_CHAT_LEARNING_STATE_TOOL_ENABLED:true}
    coach-summary:
      enabled: ${PRACTICE_CHAT_COACH_SUMMARY_TOOL_ENABLED:true}
    review-trajectory:
      enabled: ${PRACTICE_CHAT_REVIEW_TRAJECTORY_TOOL_ENABLED:false}
    submission-history-tool:
      enabled: ${PRACTICE_CHAT_SUBMISSION_HISTORY_TOOL_ENABLED:false}
    submission-history-code-detail:
      enabled: ${PRACTICE_CHAT_SUBMISSION_HISTORY_CODE_DETAIL_ENABLED:true}
    prompt:
      total-token-budget: ${PRACTICE_CHAT_PROMPT_TOKEN_BUDGET:8000}
  practice:
    code-review:
      enabled: ${PRACTICE_CODE_REVIEW_ENABLED:true}
  queue:
    message:
      max-value-bytes: ${QUEUE_MESSAGE_MAX_VALUE_BYTES:65536}
    consumer:
      enabled: ${QUEUE_CONSUMER_ENABLED:false}
      poll-interval: ${QUEUE_CONSUMER_POLL_INTERVAL:10s}
      shutdown-timeout: ${QUEUE_CONSUMER_SHUTDOWN_TIMEOUT:30s}
      lease-duration: ${QUEUE_CONSUMER_LEASE_DURATION:10m}
      max-attempts: ${QUEUE_CONSUMER_MAX_ATTEMPTS:5}
      retry-initial-backoff: ${QUEUE_CONSUMER_RETRY_INITIAL_BACKOFF:30s}
      retry-max-backoff: ${QUEUE_CONSUMER_RETRY_MAX_BACKOFF:15m}
    cleanup:
      succeeded-retention: ${QUEUE_CLEANUP_SUCCEEDED_RETENTION:7d}
      fixed-delay: ${QUEUE_CLEANUP_FIXED_DELAY:1h}
      batch-size: ${QUEUE_CLEANUP_BATCH_SIZE:1000}

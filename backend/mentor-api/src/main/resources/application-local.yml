spring:
  autoconfigure:
    exclude: []
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:algo_mentor}
    username: ${POSTGRES_USER:algo_mentor}
    password: ${POSTGRES_PASSWORD:algo_mentor_dev}
  flyway:
    enabled: true
algo-mentor:
  database-backup:
    enabled: ${DATABASE_BACKUP_ENABLED:true}
  cache:
    enabled: ${CACHE_ENABLED:true}
    metrics-enabled: ${CACHE_METRICS_ENABLED:true}
    shared-provider: ${CACHE_SHARED_PROVIDER:postgres-coherent-caffeine}
    redis:
      enabled: ${CACHE_REDIS_ENABLED:true}
      host: ${CACHE_REDIS_HOST:localhost}
      port: ${CACHE_REDIS_PORT:6379}
      database: ${CACHE_REDIS_DATABASE:0}
      username: ${CACHE_REDIS_USERNAME:}
      password: ${CACHE_REDIS_PASSWORD:}
      ssl-enabled: ${CACHE_REDIS_SSL_ENABLED:false}
      command-timeout: ${CACHE_REDIS_COMMAND_TIMEOUT:100ms}
      connect-timeout: ${CACHE_REDIS_CONNECT_TIMEOUT:1s}
      shutdown-timeout: ${CACHE_REDIS_SHUTDOWN_TIMEOUT:2s}
      max-value-bytes: ${CACHE_REDIS_MAX_VALUE_BYTES:65536}
    coherence:
      enabled: ${CACHE_COHERENCE_ENABLED:true}
      poll-interval: ${CACHE_COHERENCE_POLL_INTERVAL:1s}
      batch-size: ${CACHE_COHERENCE_BATCH_SIZE:500}
      jitter-ratio: ${CACHE_COHERENCE_JITTER_RATIO:0.2}
      event-retention: ${CACHE_COHERENCE_EVENT_RETENTION:24h}
      cleanup-interval: ${CACHE_COHERENCE_CLEANUP_INTERVAL:1h}
  ai-governance:
    runtime-cache:
      settings-ttl: ${AI_RUNTIME_SETTINGS_CACHE_TTL:2m}
      user-policy-ttl: ${AI_USER_POLICY_CACHE_TTL:2m}
  auth:
    cache:
      access-snapshot-ttl: ${AUTH_ACCESS_SNAPSHOT_CACHE_TTL:1m}
      beta-access-settings-ttl: ${AUTH_BETA_ACCESS_SETTINGS_CACHE_TTL:30s}
      beta-email-membership-ttl: ${AUTH_BETA_EMAIL_MEMBERSHIP_CACHE_TTL:1m}
  problem:
    cache:
      static-snapshot-maximum-size: ${PROBLEM_STATIC_SNAPSHOT_CACHE_MAXIMUM_SIZE:4000}
      filters-maximum-size: ${PROBLEM_FILTERS_CACHE_MAXIMUM_SIZE:2}
  learning-plan-template:
    cache:
      catalog-maximum-size: ${LEARNING_PLAN_TEMPLATE_CATALOG_CACHE_MAXIMUM_SIZE:2}
  queue:
    consumer:
      enabled: true
  practice:
    code-review:
      enabled: true
  learner-memory:
    code-review-consumer:
      enabled: true
    declared-update:
      enabled: true
